# L1 Tiny Demo Configuration
# Thresholds are starter heuristic values — NOT cited from paper.pdf
# Adjust via config; do not hardcode in Python.

input:
  mode: local_substitute  # Options: fineweb_streaming, ultra_fineweb_streaming, local_substitute
  dataset: HuggingFaceFW/fineweb
  split: sample-10BT
  n: 20
  fallback_path: data/l0_raw/sample_l0_tiny_SUBSTITUTE.jsonl

# Optional: openbmb/Ultra-FineWeb (paper-aligned) — uncomment to try first
# input:
#   mode: ultra_fineweb_streaming
#   dataset: openbmb/Ultra-FineWeb
#   split: train
#   n: 20
#   fallback_path: data/l0_raw/sample_l0_tiny_SUBSTITUTE.jsonl

filters:
  min_chars: 200
  min_words: 30
  min_alpha_ratio: 0.5
  max_symbol_ratio: 0.3

output:
  dir: data/l1_filtered
  basename: l1_filtered_tiny
  formats:
    - parquet
    - jsonl