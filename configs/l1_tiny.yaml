# ==============================================================================
# L1 Tiny Demo Pipeline Configuration
# Part of the L0-L4 Tiered Data Management Framework (arXiv:2602.09003)
#
# NOTE: Filter thresholds, heuristic values, and sample sizes are starter
# baseline values for demo reproduction — NOT cited from paper.pdf.
# ==============================================================================

input:
  # Data loading mode: local_substitute | fineweb_streaming | ultra_fineweb_streaming
  mode: local_substitute

  # Dataset name if streaming from Hugging Face Hub
  dataset: HuggingFaceFW/fineweb

  # Split name for streaming mode
  split: sample-10BT

  # Target number of records for tiny demo test run
  n: 20

  # Path to local tiny substitute dataset (used in local_substitute mode or as fallback)
  fallback_path: data/l0_raw/sample_l0_tiny_SUBSTITUTE.jsonl

filters:
  # Minimum character count required for document retention
  min_chars: 200

  # Minimum word count required for document retention
  min_words: 30

  # Minimum ratio of alphabetic characters to total characters
  min_alpha_ratio: 0.5

  # Maximum allowable ratio of symbols to total characters
  max_symbol_ratio: 0.3

output:
  # Output directory for L1 cleaned and filtered records
  dir: data/l1_filtered

  # Base filename for outputs (will produce .parquet and .jsonl files)
  basename: l1_filtered_tiny

  # Storage formats to export
  formats:
    - parquet
    - jsonl