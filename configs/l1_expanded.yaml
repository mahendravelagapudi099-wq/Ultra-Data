# L1 Expanded Configuration
# Supports real data ingestion from openbmb/Ultra-FineWeb with automatic mock fallback
# Thresholds are starter heuristic values — NOT cited from paper.pdf

input:
  use_real_data: true
  real_data_path: data/l0_raw/l0_real_sample.jsonl
  mode: real_data_streaming
  dataset: openbmb/Ultra-FineWeb
  split: train
  n: 300
  fallback_path: data/l0_raw/l0_expanded_SUBSTITUTE.jsonl

filters:
  min_chars: 200
  min_words: 30
  min_alpha_ratio: 0.5
  max_symbol_ratio: 0.3

output:
  dir: data/l1_filtered
  basename: l1_expanded_SUBSTITUTE
  formats:
    - parquet
    - jsonl