# L1 Expanded Demo Configuration
# Thresholds are starter heuristic values — NOT cited from paper.pdf
# Outputs to data/l1_filtered/l1_expanded_SUBSTITUTE.jsonl

input:
  mode: local_substitute
  dataset: HuggingFaceFW/fineweb
  split: sample-10BT
  n: 200
  fallback_path: data/l0_raw/l0_expanded_SUBSTITUTE.jsonl

filters:
  min_chars: 200
  min_words: 30
  min_alpha_ratio: 0.5
  max_symbol_ratio: 0.3

output:
  dir: data/l1_filtered
  basename: l1_expanded_SUBSTITUTE
  formats:
    - parquet
    - jsonl